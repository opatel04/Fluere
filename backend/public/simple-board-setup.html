<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Board Setup - TaskSnap</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .preset-btn {
            padding: 15px 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-size: 13px;
        }

        .preset-btn:hover {
            border-color: #667eea;
            background: #f0f3ff;
        }

        .preset-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .preset-icon {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .list-inputs {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .list-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .list-input-row input {
            flex: 1;
        }

        .btn-remove {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-add {
            background: #5f27cd;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
        }

        .btn-add:hover {
            background: #4a1da8;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 20px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .hint {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Quick Board Setup</h1>
            <p>Create your lists in seconds</p>
        </div>

        <div class="content">
            <!-- User Info -->
            <div class="section">
                <div class="form-group">
                    <label>User ID</label>
                    <input type="text" id="userId" value="d56b609c-1727-4e9a-bd39-935cf26799c8">
                </div>
                <div class="form-group">
                    <label>Board ID</label>
                    <input type="text" id="boardId" value="67a2aeb1809e0aa93a8d79c9">
                </div>
            </div>

            <!-- Presets -->
            <div class="section">
                <div class="section-title">Choose a Preset</div>
                <div class="preset-grid">
                    <button class="preset-btn" data-preset="basic">
                        <div class="preset-icon">📋</div>
                        <div>Basic</div>
                    </button>
                    <button class="preset-btn" data-preset="priority">
                        <div class="preset-icon">🎯</div>
                        <div>Priority</div>
                    </button>
                    <button class="preset-btn" data-preset="kanban">
                        <div class="preset-icon">📊</div>
                        <div>Kanban</div>
                    </button>
                    <button class="preset-btn" data-preset="agile">
                        <div class="preset-icon">⚡</div>
                        <div>Agile</div>
                    </button>
                    <button class="preset-btn active" data-preset="custom">
                        <div class="preset-icon">✏️</div>
                        <div>Custom</div>
                    </button>
                </div>
            </div>

            <!-- List Inputs -->
            <div class="section">
                <div class="section-title">Your Lists</div>
                <div class="list-inputs" id="listInputs">
                    <div class="list-input-row">
                        <input type="text" placeholder="List 1" value="To Do">
                        <button class="btn-remove" onclick="removeList(this)">✕</button>
                    </div>
                    <div class="list-input-row">
                        <input type="text" placeholder="List 2" value="In Progress">
                        <button class="btn-remove" onclick="removeList(this)">✕</button>
                    </div>
                    <div class="list-input-row">
                        <input type="text" placeholder="List 3" value="Done">
                        <button class="btn-remove" onclick="removeList(this)">✕</button>
                    </div>
                </div>
                <button class="btn-add" onclick="addList()" style="margin-top: 10px;">+ Add List</button>
                <div class="hint">Enter one list name per row. Max 10 lists.</div>
            </div>

            <!-- Create Button -->
            <button class="btn-primary" onclick="createLists()">Create Lists on Trello</button>

            <!-- Result -->
            <div class="result" id="result"></div>
        </div>
    </div>

    <script>
        const presets = {
            basic: ['To Do', 'In Progress', 'Done'],
            priority: ['Urgent', 'High Priority', 'Medium Priority', 'Low Priority', 'Done'],
            kanban: ['Backlog', 'To Do', 'In Progress', 'Review', 'Done'],
            agile: ['Backlog', 'Sprint Planning', 'In Progress', 'Testing', 'Done'],
            custom: ['To Do', 'In Progress', 'Done']
        };

        // Preset selection
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                const preset = this.dataset.preset;
                loadPreset(preset);
            });
        });

        function loadPreset(preset) {
            const lists = presets[preset] || presets.custom;
            const container = document.getElementById('listInputs');

            container.innerHTML = lists.map((name, i) => `
                <div class="list-input-row">
                    <input type="text" placeholder="List ${i + 1}" value="${name}">
                    <button class="btn-remove" onclick="removeList(this)">✕</button>
                </div>
            `).join('');
        }

        function addList() {
            const container = document.getElementById('listInputs');
            const rows = container.querySelectorAll('.list-input-row');

            if (rows.length >= 10) {
                alert('Maximum 10 lists allowed');
                return;
            }

            const newRow = document.createElement('div');
            newRow.className = 'list-input-row';
            newRow.innerHTML = `
                <input type="text" placeholder="List ${rows.length + 1}" value="">
                <button class="btn-remove" onclick="removeList(this)">✕</button>
            `;
            container.appendChild(newRow);
        }

        function removeList(btn) {
            const container = document.getElementById('listInputs');
            const rows = container.querySelectorAll('.list-input-row');

            if (rows.length <= 1) {
                alert('Must have at least one list');
                return;
            }

            btn.parentElement.remove();
        }

        async function createLists() {
            const userId = document.getElementById('userId').value;
            const boardId = document.getElementById('boardId').value;
            const resultDiv = document.getElementById('result');

            // Get list names from inputs
            const inputs = document.querySelectorAll('#listInputs input');
            const listNames = Array.from(inputs)
                .map(input => input.value.trim())
                .filter(name => name.length > 0);

            if (listNames.length === 0) {
                showResult('Please enter at least one list name', 'error');
                return;
            }

            // Show loading
            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.textContent = '⏳ Creating lists...';

            try {
                const response = await fetch('http://localhost:3000/api/v1/simple-board/create-lists', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userId: userId,
                        boardId: boardId,
                        listNames: listNames
                    })
                });

                const data = await response.json();
                console.log('Response:', data);

                if (data.success) {
                    let message = `✅ ${data.data.message}\n\n`;

                    if (data.data.created.length > 0) {
                        message += `✨ Created: ${data.data.created.join(', ')}\n`;
                    }
                    if (data.data.alreadyExists.length > 0) {
                        message += `ℹ️ Already existed: ${data.data.alreadyExists.join(', ')}\n`;
                    }
                    if (data.data.failed.length > 0) {
                        message += `❌ Failed: ${data.data.failed.map(f => f.name).join(', ')}`;
                    }

                    showResult(message, 'success');
                } else {
                    showResult('❌ ' + (data.error || 'Failed to create lists'), 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showResult('❌ Failed to connect to server. Make sure it is running.', 'error');
            }
        }

        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = `result ${type}`;
            resultDiv.innerHTML = message.replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
