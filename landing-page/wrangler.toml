name = "tasksnap-api"
main = "src/worker.js"
compatibility_date = "2024-01-01"
workers_dev = true

# Worker configuration
[vars]
ENVIRONMENT = "production"
VERSION = "1.0.0"
MAX_REQUEST_SIZE = 10485760  # 10MB in bytes

# KV Namespace for storing shared task lists
[[kv_namespaces]]
binding = "TASKSNAP_KV"
id = "a37f1eb8f4124f06a7fe60ece60600db"  # Replace with your actual KV namespace ID
# To get your KV namespace ID, run: wrangler kv namespace create "TASKSNAP_KV"

# Development environment
[env.development]
name = "tasksnap-api-dev"
[env.development.vars]
ENVIRONMENT = "development"
VERSION = "1.0.0-dev"

# Production environment
[env.production]
name = "tasksnap-api"
workers_dev = true
[env.production.vars]
ENVIRONMENT = "production"
VERSION = "1.0.0"
MAX_REQUEST_SIZE = 10485760

# Production KV namespace
[[env.production.kv_namespaces]]
binding = "TASKSNAP_KV"
id = "a37f1eb8f4124f06a7fe60ece60600db"

# Secrets (managed via wrangler secret put)
# OPENAI_API_KEY - Set with: wrangler secret put OPENAI_API_KEY
