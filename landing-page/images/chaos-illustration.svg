<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .chaos-bg { fill: #2D1B0E; }
      .paper { fill: #F5E6D3; stroke: #8B4513; stroke-width: 1; }
      .text-line { fill: none; stroke: #4A4A4A; stroke-width: 1; }
      .person { fill: #D2B48C; stroke: #8B4513; stroke-width: 1.5; }
      .laptop { fill: #2F2F2F; stroke: #1A1A1A; stroke-width: 1; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" class="chaos-bg"/>
  
  <!-- Scattered papers -->
  <g transform="rotate(-15 100 50)">
    <rect x="90" y="40" width="30" height="40" class="paper" rx="2"/>
    <line x1="95" y1="48" x2="115" y2="48" class="text-line"/>
    <line x1="95" y1="52" x2="110" y2="52" class="text-line"/>
    <line x1="95" y1="56" x2="118" y2="56" class="text-line"/>
    <text x="95" y="45" font-family="Arial" font-size="8" fill="#8B4513">NOTES</text>
  </g>
  
  <g transform="rotate(25 180 70)">
    <rect x="170" y="60" width="25" height="35" class="paper" rx="2"/>
    <line x1="173" y1="67" x2="190" y2="67" class="text-line"/>
    <line x1="173" y1="71" x2="188" y2="71" class="text-line"/>
    <circle cx="185" cy="85" r="8" fill="none" stroke="#FF6B6B" stroke-width="2"/>
    <text x="180" y="90" font-family="Arial" font-size="12" fill="#FF6B6B">?</text>
  </g>
  
  <g transform="rotate(-30 300 60)">
    <rect x="290" y="50" width="28" height="38" class="paper" rx="2"/>
    <line x1="293" y1="58" x2="313" y2="58" class="text-line"/>
    <line x1="293" y1="62" x2="308" y2="62" class="text-line"/>
    <line x1="293" y1="66" x2="315" y2="66" class="text-line"/>
    <line x1="293" y1="70" x2="305" y2="70" class="text-line"/>
  </g>
  
  <!-- More scattered papers -->
  <g transform="rotate(40 120 120)">
    <rect x="110" y="110" width="32" height="42" class="paper" rx="2"/>
    <line x1="114" y1="118" x2="134" y2="118" class="text-line"/>
    <line x1="114" y1="122" x2="130" y2="122" class="text-line"/>
    <line x1="114" y1="126" x2="136" y2="126" class="text-line"/>
  </g>
  
  <g transform="rotate(-20 280 100)">
    <rect x="270" y="90" width="26" height="36" class="paper" rx="2"/>
    <line x1="273" y1="98" x2="290" y2="98" class="text-line"/>
    <line x1="273" y1="102" x2="288" y2="102" class="text-line"/>
    <circle cx="285" cy="115" r="6" fill="none" stroke="#FF6B6B" stroke-width="2"/>
    <text x="281" y="119" font-family="Arial" font-size="10" fill="#FF6B6B">?</text>
  </g>
  
  <!-- Person in distress -->
  <g transform="translate(200, 150)">
    <!-- Head -->
    <circle cx="0" cy="0" r="25" class="person"/>
    <!-- Hair (messy) -->
    <path d="M-20,-15 Q-25,-25 -15,-30 Q-5,-35 5,-30 Q15,-35 25,-25 Q20,-15 15,-20" class="person"/>
    <!-- Face (stressed) -->
    <circle cx="-8" cy="-5" r="2" fill="#000"/>
    <circle cx="8" cy="-5" r="2" fill="#000"/>
    <path d="M-10,5 Q0,15 10,5" fill="none" stroke="#000" stroke-width="2"/>
    <!-- Hands on head -->
    <ellipse cx="-35" cy="-10" rx="8" ry="15" class="person" transform="rotate(-30)"/>
    <ellipse cx="35" cy="-10" rx="8" ry="15" class="person" transform="rotate(30)"/>
    <!-- Body -->
    <rect x="-15" y="25" width="30" height="40" class="person" rx="5"/>
  </g>
  
  <!-- Laptop -->
  <g transform="translate(200, 220)">
    <rect x="-25" y="0" width="50" height="30" class="laptop" rx="3"/>
    <rect x="-23" y="2" width="46" height="20" fill="#000"/>
    <circle cx="0" cy="35" r="2" fill="#666"/>
  </g>
  
  <!-- More floating papers -->
  <g transform="rotate(15 80 200)">
    <rect x="70" y="190" width="24" height="32" class="paper" rx="2"/>
    <line x1="73" y1="197" x2="88" y2="197" class="text-line"/>
    <line x1="73" y1="201" x2="85" y2="201" class="text-line"/>
  </g>
  
  <g transform="rotate(-45 320 180)">
    <rect x="310" y="170" width="28" height="36" class="paper" rx="2"/>
    <line x1="313" y1="178" x2="333" y2="178" class="text-line"/>
    <line x1="313" y1="182" x2="328" y2="182" class="text-line"/>
    <line x1="313" y1="186" x2="335" y2="186" class="text-line"/>
  </g>
  
  <!-- Stress indicators -->
  <g stroke="#FF6B6B" stroke-width="2" fill="none">
    <path d="M150,80 Q160,70 170,80"/>
    <path d="M250,90 Q260,80 270,90"/>
    <path d="M160,200 Q170,190 180,200"/>
  </g>
</svg>
