<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .solution-bg { fill: #0A0A0A; }
      .task-card { fill: #1C1C1C; stroke: #4ADE80; stroke-width: 1; }
      .task-done { fill: #1C1C1C; stroke: #4ADE80; stroke-width: 2; }
      .checkmark { fill: #4ADE80; }
      .task-text { fill: #F4F4F5; font-family: Arial, sans-serif; font-size: 10px; }
      .priority-high { fill: #EF4444; }
      .priority-med { fill: #F59E0B; }
      .priority-low { fill: #10B981; }
      .ai-glow { fill: none; stroke: #4ADE80; stroke-width: 2; opacity: 0.6; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" class="solution-bg"/>
  
  <!-- AI Processing Indicator -->
  <g transform="translate(200, 50)">
    <circle cx="0" cy="0" r="30" class="ai-glow">
      <animate attributeName="r" values="25;35;25" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="20" fill="#4ADE80" opacity="0.3"/>
    <text x="0" y="5" text-anchor="middle" class="task-text" font-size="12" fill="#4ADE80">AI</text>
  </g>
  
  <!-- Organized Task List -->
  <g transform="translate(50, 100)">
    <!-- Task 1 - Completed -->
    <rect x="0" y="0" width="300" height="35" class="task-done" rx="8"/>
    <circle cx="15" cy="17" r="8" class="checkmark"/>
    <path d="M11,17 L14,20 L19,14" fill="none" stroke="#0A0A0A" stroke-width="2"/>
    <text x="35" y="22" class="task-text">✓ Complete project proposal - Due: Today</text>
    <rect x="260" y="8" width="30" height="18" class="priority-high" rx="9"/>
    <text x="275" y="19" text-anchor="middle" font-size="8" fill="white">HIGH</text>
  </g>
  
  <g transform="translate(50, 145)">
    <!-- Task 2 - In Progress -->
    <rect x="0" y="0" width="300" height="35" class="task-card" rx="8"/>
    <circle cx="15" cy="17" r="8" fill="none" stroke="#4ADE80" stroke-width="2"/>
    <circle cx="15" cy="17" r="4" class="checkmark" opacity="0.5"/>
    <text x="35" y="22" class="task-text">📧 Send follow-up emails to clients</text>
    <rect x="260" y="8" width="30" height="18" class="priority-med" rx="9"/>
    <text x="275" y="19" text-anchor="middle" font-size="8" fill="white">MED</text>
  </g>
  
  <g transform="translate(50, 190)">
    <!-- Task 3 - Pending -->
    <rect x="0" y="0" width="300" height="35" class="task-card" rx="8"/>
    <circle cx="15" cy="17" r="8" fill="none" stroke="#4ADE80" stroke-width="2"/>
    <text x="35" y="22" class="task-text">🛒 Buy groceries for weekend</text>
    <rect x="260" y="8" width="30" height="18" class="priority-low" rx="9"/>
    <text x="275" y="19" text-anchor="middle" font-size="8" fill="white">LOW</text>
  </g>
  
  <g transform="translate(50, 235)">
    <!-- Task 4 - Scheduled -->
    <rect x="0" y="0" width="300" height="35" class="task-card" rx="8"/>
    <circle cx="15" cy="17" r="8" fill="none" stroke="#4ADE80" stroke-width="2"/>
    <text x="35" y="22" class="task-text">📞 Call mom - Scheduled: Tomorrow 2PM</text>
    <rect x="260" y="8" width="30" height="18" class="priority-med" rx="9"/>
    <text x="275" y="19" text-anchor="middle" font-size="8" fill="white">MED</text>
  </g>
  
  <!-- Progress indicator -->
  <g transform="translate(370, 120)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#4ADE80" stroke-width="3"/>
    <path d="M -15,-15 A 25,25 0 0,1 15,-15" fill="none" stroke="#4ADE80" stroke-width="6"/>
    <text x="0" y="5" text-anchor="middle" class="task-text" font-size="10" fill="#4ADE80">75%</text>
    <text x="0" y="-35" text-anchor="middle" class="task-text" font-size="8">Complete</text>
  </g>
  
  <!-- Magic transformation arrows -->
  <g stroke="#4ADE80" stroke-width="2" fill="none" opacity="0.7">
    <path d="M180,70 Q190,80 200,90">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M220,70 Q230,80 240,90">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
    </path>
    <path d="M200,80 L205,75 M200,80 L195,75" stroke-linecap="round"/>
    <path d="M240,80 L245,75 M240,80 L235,75" stroke-linecap="round"/>
  </g>
  
  <!-- Clean organization indicators -->
  <g transform="translate(20, 280)">
    <rect x="0" y="0" width="60" height="15" fill="#4ADE80" opacity="0.2" rx="7"/>
    <text x="30" y="10" text-anchor="middle" font-size="8" fill="#4ADE80">ORGANIZED</text>
  </g>
  
  <g transform="translate(160, 280)">
    <rect x="0" y="0" width="80" height="15" fill="#4ADE80" opacity="0.2" rx="7"/>
    <text x="40" y="10" text-anchor="middle" font-size="8" fill="#4ADE80">PRIORITIZED</text>
  </g>
  
  <g transform="translate(320, 280)">
    <rect x="0" y="0" width="60" height="15" fill="#4ADE80" opacity="0.2" rx="7"/>
    <text x="30" y="10" text-anchor="middle" font-size="8" fill="#4ADE80">ACTIONABLE</text>
  </g>
</svg>
